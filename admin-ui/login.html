<!DOCTYPE html>
<html lang="en" style="background:#0f172a">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Login - Git Docs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .login-card {
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
    }
    .login-card h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }
    .login-card .subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      border: none;
      border-radius: 8px;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      width: 100%;
      justify-content: center;
    }
    .google-btn:hover { background: #3367d6; }
    .google-btn svg { width: 20px; height: 20px; }
    .error {
      background: #7f1d1d;
      border: 1px solid #991b1b;
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: #fecaca;
    }
  </style>
</head>
<body style="background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center">
  <div class="login-card" style="background:#1e293b;border:1px solid #334155;padding:3rem 2.5rem;text-align:center">
    <h1 id="siteTitle">Git Docs</h1>
    <p class="subtitle">Sign in to access documentation</p>
    <div id="error" class="error" style="display:none;"></div>
    <a href="/auth/google" class="google-btn" style="background:#4285f4;color:white">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </a>
  </div>
  <script>
    // Show error if any
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      const errorEl = document.getElementById('error');
      const messages = {
        auth_failed: 'Authentication failed. Please try again.',
        blocked: 'Your account has been blocked. Contact the administrator.',
      };
      errorEl.textContent = messages[params.get('error')] || 'An error occurred.';
      errorEl.style.display = 'block';
    }
    // Load site title
    fetch('/api/settings')
      .then(r => r.json())
      .then(s => {
        if (s.site_title) document.getElementById('siteTitle').textContent = s.site_title;
      })
      .catch(() => {});
  </script>
</body>
</html>
