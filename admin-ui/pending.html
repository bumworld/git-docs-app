<!DOCTYPE html>
<html lang="en" style="background:#0f172a">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Access Pending - Git Docs</title>
  <link rel="stylesheet" href="/ui-assets/base.css">
  <style>
    .pending-card {
      border-radius: 12px;
      max-width: 440px;
      width: 90%;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .logout-btn {
      display: inline-block;
      text-decoration: none;
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .logout-btn:hover {
      background: #334155;
      color: #e2e8f0;
    }
  </style>
</head>
<body style="display:flex;align-items:center;justify-content:center">
  <div class="pending-card" style="background:#1e293b;border:1px solid #334155;padding:3rem 2.5rem;text-align:center">
    <div class="icon">&#9203;</div>
    <h1>Access Pending</h1>
    <p>Your account is awaiting administrator approval.<br>You will be able to access the documentation once an admin approves your request.</p>
    <a href="/auth/logout" class="logout-btn" style="color:#94a3b8;border:1px solid #475569">Sign out</a>
  </div>
</body>
</html>
