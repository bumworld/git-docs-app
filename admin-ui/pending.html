<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Access Pending - Git Docs</title>
  <link rel="stylesheet" href="/ui-assets/base.css">
  <style>
    .pending-card {
      padding: 3rem 2.5rem;
      text-align: center;
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius-lg);
      max-width: 440px;
      width: 90%;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: var(--ui-text-strong);
    }
    p {
      color: var(--ui-text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .logout-btn {
      display: inline-block;
      text-decoration: none;
      padding: 0.5rem 1.5rem;
      color: var(--ui-text-muted);
      border: 1px solid var(--ui-border-strong);
      border-radius: var(--ui-radius-lg);
      transition: background-color var(--ui-transition-fast), color var(--ui-transition-fast);
      font-size: 0.9rem;
    }
    .logout-btn:hover {
      background: var(--ui-border);
      color: var(--ui-text);
    }
    body { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="pending-card">
    <div class="icon">&#9203;</div>
    <h1>Access Pending</h1>
    <p>Your account is awaiting administrator approval.<br>You will be able to access the documentation once an admin approves your request.</p>
    <a href="/auth/logout" class="logout-btn">Sign out</a>
  </div>
</body>
</html>
