<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Pending - Git Docs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pending-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 440px;
      width: 90%;
      text-align: center;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .logout-btn {
      display: inline-block;
      color: #94a3b8;
      text-decoration: none;
      padding: 0.5rem 1.5rem;
      border: 1px solid #475569;
      border-radius: 8px;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .logout-btn:hover {
      background: #334155;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="pending-card">
    <div class="icon">&#9203;</div>
    <h1>Access Pending</h1>
    <p>Your account is awaiting administrator approval.<br>You will be able to access the documentation once an admin approves your request.</p>
    <a href="/auth/logout" class="logout-btn">Sign out</a>
  </div>
</body>
</html>
