version: '3.8'

services:
  wiki:
    build: .
    container_name: git-docs-wiki
    ports:
      - "${PORT:-8080}:3000"
    volumes:
      - ./source:/app/source
      - ./conf:/app/conf
      - ./data:/app/data
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - PORT=3000
    restart: unless-stopped

