services:
  wiki:
    image: bumworld/git-docs-app:latest
    build: .
    container_name: git-docs-wiki
    ports:
      - "${PORT:-8080}:3000"
    volumes:
      - ./sample/source:/app/source
      - ./sample/conf:/app/conf
      - ./sample/data:/app/data
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      # .env 또는 셸 환경에 SESSION_SECRET 을 반드시 설정해야 한다 (미설정 시 compose 가 시작을 거부).
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set (e.g. in a .env file)}
      - PORT=3000
    restart: unless-stopped

