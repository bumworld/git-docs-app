<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>읽은 책 추가 - 독서 기록 앱</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #1a1a1a; min-height: 100vh; }

  /* Header */
  .header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.5rem; position: sticky; top: 0; z-index: 10; }
  .btn-back { width: 40px; height: 40px; border: none; background: none; font-size: 1.25rem; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .btn-back:hover { background: #f3f4f6; }
  .header-title { font-size: 1rem; font-weight: 600; }

  /* Form */
  .form-wrap { padding: 1.5rem 1rem; max-width: 480px; margin: 0 auto; }
  .form-card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem; }
  .form-group label .required { color: #dc2626; margin-left: 2px; }
  .form-group input, .form-group textarea { width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9375rem; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #2d5a3d; box-shadow: 0 0 0 3px rgba(45, 90, 61, 0.15); }
  .form-group input::placeholder, .form-group textarea::placeholder { color: #9ca3af; }
  .form-group textarea { min-height: 80px; resize: vertical; }

  /* Rating */
  .rating-group { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
  .rating-btn { width: 40px; height: 40px; border: 1px solid #d1d5db; background: #fff; border-radius: 8px; font-size: 1.25rem; cursor: pointer; transition: all 0.15s; }
  .rating-btn:hover { border-color: #2d5a3d; background: #f0f7f1; }
  .rating-btn.active { background: #2d5a3d; border-color: #2d5a3d; }
  .rating-btn.active .star { color: #fff; }
  .rating-label { font-size: 0.8125rem; color: #6b7280; margin-left: 0.5rem; }

  /* Date */
  .date-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9375rem; }

  /* Submit */
  .btn-submit { width: 100%; padding: 0.875rem 1rem; background: #2d5a3d; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
  .btn-submit:hover { background: #244a32; }
</style>
</head>
<body>

<header class="header">
  <button class="btn-back" title="뒤로">←</button>
  <span class="header-title">읽은 책 추가</span>
</header>

<main class="form-wrap">
  <div class="form-card">
    <form>
      <div class="form-group">
        <label>책 제목 <span class="required">*</span></label>
        <input type="text" placeholder="예: 클린 코드" maxlength="100">
      </div>

      <div class="form-group">
        <label>저자 <span class="required">*</span></label>
        <input type="text" placeholder="예: 로버트 C. 마틴" maxlength="50">
      </div>

      <div class="form-group">
        <label>읽은 날짜 <span class="required">*</span></label>
        <input type="date" class="date-input" value="2026-02-19">
      </div>

      <div class="form-group">
        <label>별점 <span class="required">*</span></label>
        <div class="rating-group">
          <button type="button" class="rating-btn">☆</button>
          <button type="button" class="rating-btn">☆</button>
          <button type="button" class="rating-btn">☆</button>
          <button type="button" class="rating-btn">☆</button>
          <button type="button" class="rating-btn active">☆</button>
          <span class="rating-label">5점 선택됨</span>
        </div>
      </div>

      <div class="form-group">
        <label>한줄 평 <span style="color:#9ca3af;font-weight:400">(선택)</span></label>
        <textarea placeholder="이 책에 대한 짧은 감상을 남겨보세요 (최대 200자)"></textarea>
      </div>

      <button type="submit" class="btn-submit">저장하기</button>
    </form>
  </div>
</main>

</body>
</html>
