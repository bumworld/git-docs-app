<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>책 상세 - 독서 기록 앱</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #1a1a1a; min-height: 100vh; }

  /* Header */
  .header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.5rem; position: sticky; top: 0; z-index: 10; }
  .btn-back { width: 40px; height: 40px; border: none; background: none; font-size: 1.25rem; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .btn-back:hover { background: #f3f4f6; }
  .header-title { font-size: 1rem; font-weight: 600; }

  /* Content */
  .main { padding: 1.5rem 1rem; max-width: 480px; margin: 0 auto; }
  .book-cover-large { width: 100%; max-width: 200px; aspect-ratio: 2/3; margin: 0 auto 1.5rem; display: block; background: linear-gradient(135deg, #e8f0e9 0%, #d4e5d7 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 5rem; }
  .book-detail { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .book-detail h1 { font-size: 1.375rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.4; }
  .book-detail .author { font-size: 1rem; color: #6b7280; margin-bottom: 1rem; }
  .detail-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.9375rem; }
  .detail-row .label { color: #6b7280; min-width: 80px; }
  .detail-row .value { font-weight: 500; }
  .detail-row .stars { color: #f59e0b; font-size: 1.125rem; }
  .book-note { background: #f9fafb; border-radius: 8px; padding: 1rem; margin-top: 1rem; font-size: 0.9375rem; line-height: 1.6; color: #374151; }
  .book-note .label { font-size: 0.75rem; color: #9ca3af; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Actions */
  .actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
  .btn { flex: 1; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.9375rem; font-weight: 600; cursor: pointer; border: none; }
  .btn-edit { background: #2d5a3d; color: #fff; }
  .btn-edit:hover { background: #244a32; }
  .btn-delete { background: #fff; color: #dc2626; border: 1px solid #d1d5db; }
  .btn-delete:hover { background: #fef2f2; border-color: #dc2626; }
</style>
</head>
<body>

<header class="header">
  <button class="btn-back" title="뒤로">←</button>
  <span class="header-title">책 상세</span>
</header>

<main class="main">
  <div class="book-cover-large">📖</div>

  <div class="book-detail">
    <h1>클린 코드</h1>
    <p class="author">로버트 C. 마틴</p>

    <div class="detail-row">
      <span class="label">읽은 날짜</span>
      <span class="value">2026년 2월 15일</span>
    </div>
    <div class="detail-row">
      <span class="label">별점</span>
      <span class="stars">★★★★★</span>
      <span class="value">5점</span>
    </div>

    <div class="book-note">
      <div class="label">한줄 평</div>
      개발자라면 꼭 읽어야 할 책! 코드를 작성하는 마음가짐이 바뀌었어요.
    </div>

    <div class="actions">
      <button class="btn btn-edit">수정</button>
      <button class="btn btn-delete">삭제</button>
    </div>
  </div>
</main>

</body>
</html>
