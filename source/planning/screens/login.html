<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 화면 목업</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }

  .page-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

  .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 2.25rem 2rem; width: 100%; max-width: 400px; }

  .logo-area { text-align: center; margin-bottom: 1.75rem; }
  .logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, #1e3a5f, #3b82f6); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 0.75rem; }
  .logo-title { font-size: 1.25rem; font-weight: 700; color: #111; }
  .logo-sub { font-size: 0.8125rem; color: #6b7280; margin-top: 0.25rem; }

  /* Social buttons */
  .social-btn { display: flex; align-items: center; justify-content: center; gap: 0.6rem; width: 100%; padding: 0.7rem 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1px solid #e5e7eb; background: #fff; color: #374151; margin-bottom: 0.6rem; }
  .social-btn:hover { background: #f9fafb; border-color: #d1d5db; }
  .social-btn-google { }
  .social-btn-kakao { background: #fee500; border-color: #fee500; color: #3c1e1e; }
  .social-btn-kakao:hover { background: #f5db00; }
  .social-icon { width: 18px; height: 18px; flex-shrink: 0; }

  .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; color: #9ca3af; font-size: 0.8125rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }

  /* Form */
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: 0.8125rem; font-weight: 500; color: #374151; margin-bottom: 0.35rem; }
  input { width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #d1d5db; border-radius: 7px; font-size: 0.9rem; color: #111; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
  input::placeholder { color: #9ca3af; }

  .form-footer { display: flex; justify-content: flex-end; margin-bottom: 1.25rem; }
  .link-sm { font-size: 0.8125rem; color: #3b82f6; text-decoration: none; }
  .link-sm:hover { text-decoration: underline; }

  .btn-submit { width: 100%; padding: 0.75rem; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 0.9375rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .btn-submit:hover { background: #2563eb; }

  .signup-row { text-align: center; margin-top: 1.25rem; font-size: 0.8125rem; color: #6b7280; }
  .signup-row a { color: #3b82f6; text-decoration: none; font-weight: 500; }
  .signup-row a:hover { text-decoration: underline; }

  /* Footer */
  footer { text-align: center; padding: 1.25rem; font-size: 0.75rem; color: #9ca3af; }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="card">
    <div class="logo-area">
      <div class="logo-icon">📋</div>
      <div class="logo-title">기획 문서 시스템</div>
      <div class="logo-sub">팀 기획 문서에 접근하려면 로그인하세요</div>
    </div>

    <!-- Social Login -->
    <button class="social-btn social-btn-google">
      <svg class="social-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google로 계속하기
    </button>

    <button class="social-btn social-btn-kakao">
      <svg class="social-icon" viewBox="0 0 24 24" fill="#3C1E1E">
        <path d="M12 3C6.48 3 2 6.48 2 10.8c0 2.69 1.55 5.07 3.9 6.53L5 21l4.06-2.4C9.99 18.84 10.98 19 12 19c5.52 0 10-3.48 10-8S17.52 3 12 3zm-1 11H9V9h2v5zm4 0h-2V9h2v5z"/>
      </svg>
      카카오로 계속하기
    </button>

    <div class="divider">또는 이메일로 로그인</div>

    <!-- Email Form -->
    <div class="form-group">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="name@company.com">
    </div>

    <div class="form-group">
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" placeholder="비밀번호 입력">
    </div>

    <div class="form-footer">
      <a href="#" class="link-sm">비밀번호를 잊으셨나요?</a>
    </div>

    <button class="btn-submit">로그인</button>

    <div class="signup-row">
      아직 계정이 없으신가요? <a href="#">회원가입</a>
    </div>
  </div>
</div>

<footer>© 2025 기획 문서 시스템 · 이용약관 · 개인정보처리방침</footer>

</body>
</html>
