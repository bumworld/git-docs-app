<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>내 페이지 — Git Docs</title>
  <link rel="stylesheet" href="/ui-assets/base.css">
  <link rel="stylesheet" href="/user-assets/css/my.css">
</head>
<body>

  <!-- 헤더 -->
  <div class="topbar">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      위키로 돌아가기
    </a>
    <span class="topbar-title">내 페이지</span>
    <div class="topbar-actions">
      <a href="/auth/logout" class="btn">로그아웃</a>
    </div>
  </div>

  <div class="page">

    <!-- 프로필 -->
    <div class="profile" id="profile" style="display:none">
      <div class="profile-avatar-placeholder" id="avatar-placeholder">👤</div>
      <div class="profile-info">
        <div class="profile-name" id="profile-name">—</div>
        <div class="profile-email" id="profile-email">—</div>
        <span class="badge badge-user profile-role" id="profile-role">user</span>
      </div>
    </div>

    <!-- 북마크 -->
    <div class="section">
      <div class="section-header">
        <span class="section-icon">⭐</span>
        <span class="section-title">북마크</span>
        <span class="section-count" id="bm-count">0</span>
      </div>
      <div id="bm-container"><div class="empty-state"><div class="empty-icon">⭐</div>북마크가 없습니다.</div></div>
    </div>

    <!-- 최근 본 페이지 -->
    <div class="section">
      <div class="section-header">
        <span class="section-icon">🕐</span>
        <span class="section-title">최근 본 페이지</span>
        <span class="section-count" id="his-count">0</span>
        <button class="section-action" id="clear-history-btn">전체 삭제</button>
      </div>
      <div id="his-container"><div class="empty-state"><div class="empty-icon">🕐</div>방문 기록이 없습니다.</div></div>
    </div>

  </div>

  <script src="/user-assets/js/my.js" defer></script>
</body>
</html>
